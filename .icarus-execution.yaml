# Node.js + node:test demo for the BWI Test Hub — CONTAINER execution.
# Declares a runtime PROFILE (never a raw image); the hub maps it to an
# approved image in its runner-image catalog. No environment.inherit —
# the container image provides its own PATH/HOME.
version: 1
name: node-test-demo
command:
  argv: ["node", "run.mjs"]
runtime:
  profile: node-22
  required: true
timeout:
  durationSeconds: 300
reportArtifacts:
  - kind: html-report
    path: report
    description: node:test HTML report
  - kind: junit-xml
    path: report/junit.xml
    description: JUnit results
